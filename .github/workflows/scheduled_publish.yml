name: 24/7 AI Social Media Automated Publishing

on:
  schedule:
    # 02:00 UTC = 09:00 WIB (Phono Print Posting)
    - cron: '0 2 * * *'
    # 11:30 UTC = 18:30 WIB (Cultivare Posting)
    - cron: '30 11 * * *'
  workflow_dispatch:
    inputs:
      account:
        description: 'Account to publish (phono_print, cultivare, or all)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - phono_print
          - cultivare

jobs:
  publish:
    name: Auto-Publish Social Media Posts
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Browsers (Fallback Ready)
        run: |
          playwright install --with-deps chromium || true

      - name: Execute Daily Scheduled Publishing
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME || 'phono-print' }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY || '936638937876354' }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID || '17841459567262530' }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          CULTIVARE_INSTAGRAM_ACCOUNT_ID: ${{ secrets.CULTIVARE_INSTAGRAM_ACCOUNT_ID || '17841459352375599' }}
          CULTIVARE_INSTAGRAM_ACCESS_TOKEN: ${{ secrets.CULTIVARE_INSTAGRAM_ACCESS_TOKEN }}
        run: |
          CURRENT_HOUR=$(date -u +%H)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python main.py --now --account ${{ inputs.account }}
          elif [ "$CURRENT_HOUR" = "02" ]; then
            echo "Triggering Phono Print 09:00 WIB publication..."
            python main.py --now --account phono_print
          elif [ "$CURRENT_HOUR" = "11" ]; then
            echo "Triggering Cultivare 18:30 WIB publication..."
            python main.py --now --account cultivare
          else
            echo "Running scheduled check for due posts..."
            python main.py --now --account all
          fi
